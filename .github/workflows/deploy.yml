name: deploy

# Data deploys itself. This repository is the live checkout on the Zo host, so a
# push to main only has to fast-forward that checkout and restart each of Data's
# services. scripts/zo-deploy.ts does both through Zo's MCP endpoint, speaking
# JSON-RPC directly, then proves each restart landed by waiting for that
# service's own readiness line in its log.
#
# The two services deploy in sequence, inside one job, on purpose: both fast-forward
# the same live checkout, so they must never overlap.
#
# Data's prompt is `agent/instructions.md`, but the agent answers from the copy its
# memory holds at `system/persona.md`. `npm run sync-persona` is what reconciles the
# two, so the `agent/**` path is watched and the data-http step runs the sync on the
# host after the fast-forward and before the restart. Without both halves a
# prompt-only merge changes nothing the agent can see (see #16).
#
# Needs the repository secret ZO_API_KEY: a Zo access token from
# Settings > Advanced > Access Tokens. Without it the job warns and stops;
# nothing is deployed.

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "channels/http/**"
      - "channels/discord/**"
      - "lib/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-zo-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the deploy credential
        id: credential
        env:
          ZO_API_KEY: ${{ secrets.ZO_API_KEY }}
        run: |
          if [ -z "${ZO_API_KEY}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ZO_API_KEY is not set, so nothing was deployed. Create a Zo access token (Settings > Advanced > Access Tokens) and save it as this repository's ZO_API_KEY secret."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.credential.outputs.configured == 'true'
        with:
          node-version: 24

      - name: Deploy data-http
        if: steps.credential.outputs.configured == 'true'
        env:
          ZO_API_KEY: ${{ secrets.ZO_API_KEY }}
        run: |
          node --experimental-strip-types scripts/zo-deploy.ts \
            --service data-http \
            --expect-ready "ready: data-http" \
            --run "npm run sync-persona" \
            --dir /home/workspace/users/etok/workspaces/wazootech/repos/data \
            --expect-sha "${GITHUB_SHA}"

      - name: Deploy data-discord
        if: steps.credential.outputs.configured == 'true'
        env:
          ZO_API_KEY: ${{ secrets.ZO_API_KEY }}
        run: |
          node --experimental-strip-types scripts/zo-deploy.ts \
            --service data-discord \
            --expect-ready "ready: data-discord" \
            --waiting-marker "enable Message Content Intent" \
            --dir /home/workspace/users/etok/workspaces/wazootech/repos/data \
            --expect-sha "${GITHUB_SHA}"
